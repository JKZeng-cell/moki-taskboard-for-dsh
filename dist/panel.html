<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOKI任务台</title>
  <style>.approval-inbox { display:grid; gap:12px; min-width:0; }
.approval-inbox h3,.approval-inbox p { margin:0; overflow-wrap:anywhere; }
.approval-inbox pre { margin:0; max-height:36vh; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; padding:12px; border:1px solid var(--line); border-radius:var(--control-radius); background:var(--subtle); }
.approval-inbox .actions { flex-wrap:wrap; }
.approval-reopen { position:fixed; z-index:15; right:18px; top:48px; display:inline-flex; gap:7px; align-items:center; background:var(--surface); box-shadow:0 2px 9px #0002; }

:root {
  color-scheme: light dark;
  font-family: var(--font-sans, "Segoe UI Variable", "Segoe UI", Inter, "Microsoft YaHei UI", system-ui, sans-serif);
  font-size: 13px;
  --surface: var(--color-background-primary, light-dark(#fff, #212121));
  --rail: light-dark(
    color-mix(in srgb, var(--color-background-secondary, #f6f6f6) 64%, var(--surface)),
    color-mix(in srgb, var(--color-background-secondary, #181818) 20%, var(--surface))
  );
  --subtle: color-mix(in srgb, var(--text) 3.5%, var(--surface));
  --hover: color-mix(in srgb, var(--text) 7%, var(--surface));
  --selected: color-mix(in srgb, var(--text) 10%, var(--surface));
  --line: var(--color-border-tertiary, light-dark(#e7e7e7, #363636));
  --line-strong: var(--color-border-secondary, light-dark(#cdcdcd, #4b4b4b));
  --text: var(--color-text-primary, light-dark(#202020, #f1f1f1));
  --muted: var(--color-text-secondary, light-dark(#606060, #b3b3b3));
  --faint: var(--color-text-tertiary, light-dark(#707070, #9b9b9b));
  --control-radius: var(--border-radius-md, 8px);
  --menu-radius: var(--border-radius-lg, 12px);
  --primary: light-dark(#242428, #ececed);
  --primary-hover: light-dark(#3a3a40, #fff);
  --primary-text: light-dark(#fff, #202023);
  --blue: light-dark(#3b5ab1, #a5b8ff);
  --blue-wash: light-dark(#eef2ff, #2b3450);
  --danger: light-dark(#ad3445, #ffa4ae);
  --success: light-dark(#237352, #8bdbb7);
  --shadow: light-dark(#17172017, #0006);
  --focus: light-dark(#3978be, #92baff);
  --rail-width: 238px;
  --topbar-height: 44px;
  --gutter: clamp(20px, 3.05vw, 44px);
  color: var(--text);
  background: var(--surface);
}
/* Project navigation and task evidence use the host's palette in both themes. */
.group-heading.ghost { display:flex; align-items:center; justify-content:flex-start; width:100%; min-height:24px; padding:2px 3px; color:var(--muted); font-size:12px; gap:5px; text-align:left; }
.group-heading small { margin-inline-start:auto; }
.group-heading[draggable="true"],.rail-project[draggable="true"] { cursor:grab; }
.rail-project[data-drop="before"],.rail-group[data-drop="before"] > h3 { box-shadow:inset 0 2px var(--focus); }
.rail-project[data-drop="after"],.rail-group[data-drop="after"] > h3 { box-shadow:inset 0 -2px var(--focus); }
.menu-select { display:grid; gap:4px; padding:5px 8px; color:var(--muted); font-size:12px; }
.menu-select select { min-width:0; max-width:100%; }
.portfolio-entry { position:relative; }
.portfolio-entry > .portfolio-row { width:100%; }
.portfolio-entry > .menu { position:absolute; right:6px; top:50%; transform:translateY(-50%); }
.portfolio-entry > .menu > button { border:0; background:transparent; }
.card-actions { display:inline-flex; gap:2px; align-items:center; margin-inline-start:auto; }
.card-actions .icon-button,.card-actions .card-start { min-height:24px; height:24px; padding:2px 5px; border:0; background:transparent; color:var(--muted); }
.card-actions .icon-button { width:25px; }
.card-actions .card-start { display:inline-flex; gap:3px; align-items:center; font-size:11px; }
.card-actions .card-start:hover,.card-actions .icon-button:hover { color:var(--text); background:var(--hover); }
.acceptance,.version-conflict { padding:12px; border:1px solid var(--line); border-radius:var(--control-radius); }
.acceptance { margin-block:13px; display:grid; gap:9px; }
.acceptance h4,.check-legend,.check-legend span,.evidence-files { display:flex; align-items:center; gap:6px; }
.check-meter { display:flex; height:5px; border-radius:4px; overflow:hidden; background:var(--subtle); gap:2px; }
.check-meter i[data-kind="pass"],.check-legend i[data-kind="pass"] { background:var(--success); }
.check-meter i[data-kind="fail"],.check-legend i[data-kind="fail"] { background:var(--danger); }
.check-meter i[data-kind="pending"],.check-legend i[data-kind="pending"] { background:var(--line-strong); }
.check-legend { gap:13px; color:var(--muted); font-size:11px; }
.check-legend i { width:7px; height:7px; border-radius:50%; }
.evidence-lines { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.evidence-lines li { display:flex; gap:10px; min-width:0; font-size:12px; overflow-wrap:anywhere; }
.evidence-lines strong { flex:none; }
.evidence-lines [data-kind="fail"] { color:var(--danger); }
.evidence-lines [data-kind="pass"] { color:var(--success); }
.evidence-lines small,.source-item small { display:block; color:var(--muted); }
.human-check { padding:8px 10px; border-radius:6px; background:var(--subtle); font-size:12px; }
.human-check p { margin-top:4px; }
.evidence-files,.weekdays { flex-wrap:wrap; }
.policy-form fieldset { margin:0; min-width:0; padding:10px; border:1px solid var(--line); border-radius:8px; display:grid; gap:10px; }
.policy-form legend { padding-inline:5px; font-weight:600; }
.policy-form .inline-check { display:flex; align-items:center; gap:8px; overflow-wrap:anywhere; }
.policy-form .inline-check input { width:auto; }
.weekdays { display:flex; gap:3px; }
.weekdays button { min-height:26px; padding:2px 7px; }
.weekdays button[aria-pressed="true"] { background:var(--selected); border-color:var(--line-strong); }
.window-row { padding-block:8px; border-top:1px solid var(--line); display:grid; gap:7px; }
.window-row .row { align-items:flex-end; }
.window-row label { flex:1; min-width:0; }
.file-editor,.source-item { display:grid; gap:10px; align-content:start; min-width:0; }
.source-item,.file-editor { overflow-wrap:anywhere; }
.source-item { gap:3px; padding-block:6px; }
.source-item .text-button { text-align:start; justify-self:start; }
.task-approvals pre,.version-conflict pre { max-height:180px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
.file-editor textarea { width:100%; font:13px/1.55 var(--font-mono,Consolas,monospace); }
@media(max-width:420px){.workspace-tabs > button.ghost { padding-inline:5px; }.workspace-tabs{flex-shrink:0;}}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; }
button, input, textarea, select { font: inherit; }
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 33px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--control-radius);
  background: var(--surface);
  color: var(--text);
  line-height: 1.35;
  cursor: var(--cursor-interaction, pointer);
  white-space: nowrap;
  transition: background-color 110ms, border-color 110ms, box-shadow 110ms;
}
button:hover:not(:disabled) { background: var(--hover); }
button:active:not(:disabled) { background: var(--selected); }
button:disabled { opacity: .48; cursor: default; }
button.primary { color: var(--primary-text); background: var(--primary); border-color: transparent; padding-inline: 13px; font-weight: 580; }
button.primary:hover:not(:disabled) { color: var(--primary-text); background: var(--primary-hover); }
button.ghost { background: transparent; border-color: transparent; }
button.danger { color: var(--danger); }
.icon { flex: none; vertical-align: middle; }
.icon-button { width: 33px; padding: 0; }
h1, h2, h3, h4, p, dl, dd { margin: 0; }
h1 { font-size: clamp(25px, 2.25vw, 32px); font-weight: 650; line-height: 1.18; letter-spacing: -.032em; }
h2 { font-size: 15px; font-weight: 630; }
h3 { font-size: 20px; font-weight: 650; }
h4 { font-size: 13px; font-weight: 630; }
strong, b { font-weight: 630; }
small { font-size: 11px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input:not([type="checkbox"]), textarea, select {
  min-width: 0;
  max-width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--line-strong);
  border-radius: var(--control-radius);
  color: var(--text);
  background: var(--surface);
}
input[type="checkbox"] { accent-color: var(--blue); }
select { cursor: var(--cursor-interaction, pointer); }
select:disabled { cursor: default; }
@supports (appearance: base-select) {
  select:not(.status-picker select), select:not(.status-picker select)::picker(select) { appearance: base-select; }
  select:not(.status-picker select) { align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
  select::picker-icon { content: ""; width: 6px; height: 6px; flex: none; margin: -3px 3px 0 auto;
    border: solid currentColor; border-width: 0 1.4px 1.4px 0; rotate: 45deg; color: var(--muted); }
  select::picker(select) {
    margin-block: 4px; padding: 4px; min-width: anchor-size(width); max-width: calc(100vw - 20px);
    max-height: min(320px, 55dvh); overflow: auto; border: 1px solid var(--line); border-radius: var(--menu-radius);
    background: var(--surface); color: var(--text); box-shadow: 0 6px 22px var(--shadow);
  }
  select option { min-height: 32px; padding: 6px 9px; gap: 8px; border-radius: 6px; white-space: normal; overflow-wrap: anywhere; }
  select option:is(:hover, :focus-visible) { background: var(--hover); }
  select option:checked { background: var(--subtle); }
  select option::checkmark { order: 1; margin-left: auto; }
}
textarea { resize: vertical; line-height: 1.55; }
::placeholder { color: var(--faint); opacity: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); }
.prose { line-height: 1.65; overflow-wrap: anywhere; white-space: pre-wrap; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  width: fit-content;
  max-width: 100%;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--subtle);
  color: var(--muted);
  font-size: 11px;
  font-weight: 550;
  white-space: nowrap;
}
.tag.highlighted { background: var(--blue-wash); color: var(--blue); }
[data-status] { --stage: light-dark(#687480, #a6b1bd); --stage-wash: light-dark(#edf0f3, #34383e); }
[data-status="queued"] { --stage: light-dark(#525fab, #acb2fe); --stage-wash: light-dark(#ebedfa, #31344b); }
[data-status="running"] { --stage: light-dark(#30659d, #8ec5ff); --stage-wash: light-dark(#e9f2fc, #273d52); }
[data-status="review"] { --stage: light-dark(#875711, #edc17c); --stage-wash: light-dark(#f9f1e3, #433728); }
[data-status="done"] { --stage: light-dark(#277655, #81cfa8); --stage-wash: light-dark(#eaf6ef, #283d32); }
[data-status="error"] { --stage: light-dark(#ad3a4a, #ff9aa6); --stage-wash: light-dark(#faecef, #482e34); }
[data-status="paused"], [data-status="recover"], [data-status="returned"], [data-status="refined"] {
  --stage: light-dark(#765ab0, #c5a9f6);
  --stage-wash: light-dark(#f3eefc, #393048);
}
.status {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  flex: none;
  width: fit-content;
  padding: 4px 8px;
  border-radius: 20px;
  color: var(--stage);
  background: var(--stage-wash);
  font-size: 11px;
  font-weight: 580;
  line-height: 1.25;
  white-space: nowrap;
}
.status-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--stage); }
.file-icon, .brand-icon, .empty-icon { display: inline-grid; place-items: center; flex: none; }
.file-icon { width: 34px; height: 34px; border-radius: 8px; color: var(--muted); background: var(--subtle); }
.module-icon {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 43px;
  height: 43px;
  border-radius: 11px;
  color: var(--blue);
  background: var(--blue-wash);
}
.module-icon[data-module="overview"] { background: light-dark(#eaf3ff, #263a51); color: light-dark(#345f9b, #a0c8fb); }
.module-icon[data-module="tasks"], .module-icon[data-module="task"] { background: light-dark(#f0edfc, #373049); color: light-dark(#6747a1, #ccb7fb); }
.module-icon[data-module="assets"] { background: light-dark(#e8f5ef, #294139); color: light-dark(#276c54, #91d3b6); }
.module-icon.small { width: 29px; height: 29px; border-radius: 7px; }

.app-shell {
  display: grid;
  grid-template-columns: var(--rail-width) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  height: 100dvh;
}
.workspace-main { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.app-shell[data-rail-collapsed="true"] { grid-template-columns: minmax(0, 1fr); }
.rail[hidden] { display: none; }
.rail[data-floating="true"] {
  position: fixed;
  z-index: 6;
  inset-block: var(--topbar-height) 8px;
  inset-inline-start: 6px;
  width: min(var(--rail-width), calc(100% - 12px));
  grid-template-rows: minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  box-shadow: 0 8px 28px var(--shadow);
}
.rail[data-floating="true"] > .brand { display: none; }
.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(34px, 1fr);
  align-items: center;
  column-gap: 12px;
  min-height: var(--topbar-height);
  min-width: 0;
  padding-inline: 14px;
  border-bottom: 1px solid var(--line);
}
.workspace-title { display: flex; min-width: 0; align-items: center; gap: 8px; font-size: 15px; line-height: 1.35; letter-spacing: normal; }
.workspace-heading { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rail-toggle { flex: none; color: var(--muted); }
.workspace-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.workspace-refresh { grid-column: -2; justify-self: end; color: var(--muted); }
.workspace-tabs {
  align-self: center;
  display: flex;
  justify-content: center;
  gap: 4px;
}
.workspace-tabs > button {
  min-height: 33px;
  padding-inline: 13px;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: var(--control-radius);
}
.workspace-tabs > button[aria-current] { background: var(--selected); color: var(--text); font-weight: 630; }
.brand {
  min-height: var(--topbar-height);
  justify-content: flex-start;
  gap: 10px;
  overflow: hidden;
  padding-inline: 16px;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  font-size: 13px;
  font-weight: 650;
}
.brand-icon { width: 29px; height: 29px; border-radius: 8px; color: #f3fff9; background: #216653; }
.brand-icon .icon { stroke-width: 2.2; }
.rail {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  min-width: 0;
  border-right: 1px solid var(--line);
  background: var(--rail);
}
.rail-content {
  display: flex; flex-direction: column; width: 100%; min-height: 0; min-width: 0;
  padding-top: 8px; background: var(--rail);
}
.portfolio-link {
  flex: none;
  min-height: 34px;
  justify-content: flex-start;
  gap: 8px;
  margin: 0 9px 8px;
  padding-inline: 9px;
  color: var(--muted);
  font-weight: 620;
}
.portfolio-link.ghost[aria-current] { color: var(--text); background: var(--selected); }
.portfolio-link[aria-current] .icon { color: var(--blue); }
.rail-tools { display: grid; gap: 6px; flex: none; padding: 8px 10px; border-top: 1px solid var(--line); }
.rail-tools h2 { padding-inline-start: 4px; font-size: 12px; color: var(--muted); }
.rail-create.ghost { min-height: 28px; gap: 4px; padding-inline: 6px; font-size: 12px; }
.rail-tools .search { width: 100%; max-width: none; }
.rail-scopes.segments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px; }
.rail-scopes.segments button { min-width: 0; min-height: 26px; padding-inline: 2px; gap: 3px; }
.scope-count { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.rail-projects {
  flex: 1; display: grid; align-content: start; min-height: 0; gap: 5px; overflow: auto;
  padding: 3px 10px 12px; scrollbar-color: var(--line-strong) transparent;
}
.rail-project {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  min-width: 0;
  gap: 3px 4px;
  padding: 5px 7px 7px 9px;
  border: 1px solid var(--line);
  border-radius: var(--control-radius);
  background: var(--surface);
}
.rail-project:hover { border-color: var(--line-strong); background: var(--hover); }
.rail-project[data-selected="true"] {
  border-color: color-mix(in srgb, var(--blue) 36%, var(--line));
  background: light-dark(
    color-mix(in srgb, var(--blue) 9%, var(--surface)),
    color-mix(in srgb, var(--blue) 6%, var(--surface))
  );
}
.rail-project[data-selected="true"]::before {
  position: absolute; inset-inline-start: -1px; inset-block-start: 11px; width: 3px; height: 15px;
  border-radius: 2px; background: var(--blue); content: ""; pointer-events: none;
}
.rail-project-open.ghost { justify-content: flex-start; gap: 6px; min-width: 0; min-height: 28px; padding: 0; border: 0; text-align: left; }
.rail-project-open.ghost:hover:not(:disabled) { background: transparent; }
.rail-project-open::after { position: absolute; inset: 0; border-radius: var(--control-radius); content: ""; }
.rail-project:has(.rail-project-open:focus-visible) { outline: 2px solid var(--focus); outline-offset: 1px; }
.rail-project-open:focus-visible { outline: none; }
.rail-project-open strong { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rail-project .module-icon.small { width: 22px; height: 22px; border-radius: 5px; color: var(--muted); background: transparent; }
.rail-project[data-selected="true"] .module-icon.small { color: var(--blue); background: var(--blue-wash); }
.rail-project .menu { z-index: 1; }
.rail-project .menu > button { width: 28px; min-height: 28px; border: 0; background: transparent; color: var(--muted); }
.rail-project .menu > button:hover:not(:disabled) { background: var(--hover); }
.rail-card-meta { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.rail-card-meta .status { padding: 2px 6px; }
.rail-completion { display: flex; align-items: center; justify-content: flex-end; gap: 5px; min-width: 0; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rail-completion .progress-track { flex: 0 1 30px; width: 30px; min-width: 0; height: 3px; }
.rail-empty { padding: 12px 4px; color: var(--muted); font-size: 12px; }

.page { min-width: 0; overflow: auto; overscroll-behavior: contain; scrollbar-color: var(--line-strong) transparent;
  padding-bottom: var(--composer-space, 0px); scroll-padding-bottom: var(--composer-space, 0px); }
.page-content { max-width: 1480px; margin-inline: auto; padding: 14px var(--gutter) 40px; min-width: 0; }
.page:is([data-page="projects"], [data-page="tasks"], [data-page="assets"], [data-page="sessions"]) {
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.list-page {
  container: list / inline-size;
  display: flex; flex: 1; flex-direction: column; min-height: 0; width: 100%;
}
.page-content.list-page { padding-bottom: 2px; }
.list-page .list-toolbar { flex: none; }
.list-page > .empty-state { min-height: 0; overflow: auto; }
.list-page .table-frame, .list-page .asset-table, .list-page .asset-gallery {
  min-height: 0; overflow: auto; overscroll-behavior: contain;
}
.task-table th, .asset-columns { position: sticky; top: 0; z-index: 1; }
.kanban { flex: 1; min-height: 0; }
.list-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; margin-bottom: 10px; }
.list-actions { display: flex; align-items: center; gap: 7px; }
.list-count { margin-inline-end: 4px; color: var(--muted); white-space: nowrap; font-size: 12px; font-variant-numeric: tabular-nums; }
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  width: min(100%, 248px);
  min-width: 90px;
  padding: 0 9px;
  min-height: 33px;
  color: var(--muted);
  border: 1px solid var(--line);
  background: var(--subtle);
  border-radius: var(--control-radius);
}
.search input[type="search"] { flex: 1; width: 100%; padding: 6px 0; border: 0; border-radius: 0; color: var(--text); background: transparent; }
.search:hover { border-color: var(--line-strong); }
.search:focus-within { border-color: var(--focus); outline: 1px solid var(--focus); background: var(--surface); }
.search input:focus { outline: none; }
.filters { display: flex; align-items: center; gap: 7px; min-width: 0; }
.filters .search { flex: 1; min-width: 0; max-width: 248px; }
.filters select { flex: none; min-height: 33px; }

.progress-track { display: block; height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }

.quick-controls { display: flex; align-items: center; min-width: 0; gap: 5px; }
.quick-composer .quick-choice {
  display: flex; align-items: center; gap: 4px; flex: 0 1 auto;
  min-width: 0; max-width: min(52%, 270px); padding-left: 7px;
  border-radius: 8px; color: var(--muted); background: var(--subtle);
}
.quick-composer .quick-choice:hover, .quick-choice:focus-within { background: var(--hover); color: var(--text); }
.quick-choice:has(select:focus-visible) { outline: 2px solid var(--focus); outline-offset: 1px; }
.quick-choice select {
  min-width: 0; min-height: 28px; padding: 4px 6px 4px 0; border: 0; outline-offset: 0;
  color: inherit; background: transparent; font-size: 12px; text-overflow: ellipsis; cursor: var(--cursor-interaction, pointer);
}
.quick-choice select:focus-visible { outline: none; }
.quick-composer .quick-timing { flex: none; max-width: none; }
.quick-controls .quick-new-project { min-height: 28px; padding-inline: 7px; }
.quick-controls .quick-send { flex: none; width: 32px; height: 32px; min-height: 32px; margin-left: auto; padding: 0; border-radius: 50%; }
.heading-edit { flex:none; color:var(--muted); }
.attachment-buttons { display:inline-flex; align-items:center; gap:1px; flex:none; }
.attachment-buttons .icon-button { width:27px; height:27px; min-height:27px; padding:0; }
.attachment-list { display:flex; flex-wrap:wrap; gap:5px; max-height:92px; overflow:auto; list-style:none; padding:0; margin:0; }
.attachment-list li { display:flex; align-items:center; gap:5px; min-width:0; max-width:min(225px,100%); padding:3px 4px 3px 7px; background:var(--selected); border-radius:6px; }
.attachment-list li > span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attachment-list .icon-button { flex:none; width:20px; height:20px; min-height:20px; padding:0; }
.quick-composer[data-dragging="true"],.task-form[data-dragging="true"] { outline:2px solid var(--focus,Highlight); outline-offset:-2px; }
.task-attachments { display:grid; gap:4px; }
.refine-input,.refine-composer { display:grid; gap:5px; min-width:0; }
.refine-composer { padding:8px; border:1px solid var(--line-strong); border-radius:var(--control-radius); background:var(--surface); }
.refine-composer:focus-within { border-color:var(--focus); }
.refine-form[data-dragging="true"] .refine-composer { outline:2px solid var(--focus); outline-offset:-2px; }
.refine-composer textarea { min-height:78px; width:100%; padding:3px 4px; border:0; outline:none; box-shadow:none; background:transparent; }
.refine-composer .attachment-buttons { justify-self:start; }
.run-files h5 { margin:2px 0; }
.quick-controls { flex-wrap:wrap; }
.quick-controls .quick-send:disabled { background: var(--selected); color: var(--faint); opacity: 1; }
.quick-feedback { display: flex; align-items: center; gap: 6px; min-width: 0; border-top: 1px solid var(--line);
  margin-top: 2px; padding: 5px 3px 0; color: var(--muted); font-size: 12px; }
.quick-feedback > .icon { color: var(--success); }
.quick-feedback > span { min-width: 0; max-height: 5em; overflow: auto; overflow-wrap: anywhere; }
.quick-feedback > .text-button { flex: none; margin-left: auto; }

.modal:has(.task-form) { width: min(540px, calc(100vw - 22px)); }
.modal:has(.task-form) .dialog-body { padding: 0; }
.modal:has(.task-form) .dialog-body > .notice { margin: 14px 19px 0; }
.task-form { gap: 0; }
.task-form-fields, .task-form-settings { display: grid; gap: 12px; min-width: 0; }
.task-form-fields { gap: 16px; padding: 18px 19px; }
.task-form .required-mark { color: var(--danger); }
.task-form input[name="title"] { min-height: 38px; }
.task-form textarea[name="instructions"] { min-height: 102px; }
.task-form-options > .disclosure { border: 1px solid var(--line); border-radius: 8px; background: var(--subtle); }
.task-form-options summary { min-height: 40px; border-radius: 7px; }
.task-form-options details[open] > summary { border-bottom: 1px solid var(--line); border-radius: 7px 7px 0 0; }
.task-form-options .disclosure-body { padding: 12px; }
.task-form .task-initial-status { display: flex; align-items: center; gap: 6px; margin-inline-start: auto; white-space: nowrap; color: var(--muted); }
.task-initial-status select { width: 6.5em; min-height: 28px; padding: 3px 8px; }
:lang(en) .task-initial-status select { width: 8.7em; }
.task-form [aria-invalid="true"] { border-color: var(--danger); }
.task-form-settings .inline-error { font-size: 12px; }
.task-form-actions {
  position: sticky;
  z-index: 2;
  bottom: 0;
  padding: 12px 19px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.task-form-actions button { min-height: 35px; }

.drawer:not(.drawer-left) .dialog-body { padding: 19px; }
.task-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 10px; }
.task-hero h3 { padding-top: 7px; line-height: 1.3; overflow-wrap: anywhere; }
.task-hero-status { display: grid; justify-items: end; gap: 3px; padding-top: 7px; }
.task-hero-status > .status { min-height: 26px; }
.drawer-updated { margin-top: 13px; font-size: 11px; }
.drawer-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
.status-picker {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  min-height: 26px;
  padding-right: 5px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--subtle);
  color: var(--muted);
}
.status-picker .status { background: transparent; }
.status-picker select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
.status-picker:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.task-description { margin-block: 17px; padding-top: 12px; border-top: 1px solid var(--line); }
.task-description h4 { margin-bottom: 6px; }
.task-description .prose[data-expanded="false"] { max-height: 8.25em; overflow: hidden; }
.task-description > .text-button { margin-top: 4px; font-size: 12px; }
.task-execution { margin-block: 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--subtle); }
.execution-summary { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 9px 11px; }
.execution-summary > .file-icon { background: var(--surface); }
.execution-summary > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.execution-summary p { margin-top: 3px; font-size: 11px; }
.task-folds { border: 1px solid var(--line); border-radius: 8px; }
.task-approvals { margin-block: 13px; }
.task-approvals .disclosure-body > .disclosure { border-top: 1px solid var(--line); }
.task-approvals pre { margin: 0 0 6px; }
.review-history { list-style: none; padding: 0; margin: 0; }
.review-history li { padding-block: 7px; }
.review-history li + li { border-top: 1px solid var(--line); }
.review-history p { margin: 5px 0 0; }
.task-folds > .disclosure + .disclosure, .task-execution > .disclosure { border-top: 1px solid var(--line); }
.disclosure > summary {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 37px;
  padding: 5px 10px;
  list-style: none;
  cursor: pointer;
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary:hover { background: var(--hover); }
.disclosure > summary strong { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.disclosure > summary .icon, .disclosure-meta { color: var(--muted); }
.disclosure[open] > summary .icon:last-child { transform: rotate(90deg); }
.disclosure-meta { flex: none; font-size: 11px; }
.disclosure-body { padding: 5px 10px 10px; }
.past-executions { display: grid; gap: 5px; }
.past-executions > .disclosure { border: 1px solid var(--line); border-radius: 7px; }
.input-list { display: flex; flex-wrap: wrap; gap: 5px; }
.input-list button { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.task-criteria { display: grid; gap: 6px; }
.task-criteria p, .task-criteria ul { margin: 0; overflow-wrap: anywhere; }
.task-criteria ul { padding-left: 19px; }
.run-card { display: grid; gap: 7px; }
.run-time { font-size: 11px; }
.run-files { display: grid; gap: 5px; }
.run-file { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.run-file > span:nth-child(2) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.run-file button { min-height: 25px; padding-inline: 4px; font-size: 11px; }
.run-session { justify-self: start; }
.checks { padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 12px; }
.checks h5 { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin: 0; font-size: 12px; }
.checks ul { display: grid; gap: 6px; padding: 0; margin: 7px 0 0; list-style: none; }
.checks li { display: flex; align-items: flex-start; gap: 6px; }
.checks li div { min-width: 0; overflow-wrap: anywhere; }
.checks p { font-size: 11px; }
.check-pass, .check-fail { flex: none; font-weight: 620; }
.check-pass { color: var(--success); }
.check-fail { color: var(--danger); }

@media (max-width: 940px) {
  :root { --rail-width: 208px; }
  .asset-line, .asset-columns { gap: 8px; }
  .version-toggle .muted { display: none; }
  .portfolio-columns, .portfolio-row { grid-template-columns: minmax(104px, 1.5fr) minmax(60px, .65fr) minmax(66px, .8fr) 36px 43px 15px; gap: 7px; }
}
@media (max-width: 780px) {
  .overview-grid { grid-template-columns: minmax(0, 1fr); }
  .overview-activity:has(.release-history[open]) { grid-auto-rows: 1fr; }
  .asset-table { --asset-grid: minmax(0, 1.5fr) minmax(64px, .66fr) 4rem 9rem; }
}
@media (max-width: 680px) {
  :root { --gutter: 14px; }
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .topbar { grid-template-columns: minmax(0, 1fr) 33px; column-gap: 5px; padding-inline: 6px; }
  .topbar[data-project="true"] { grid-template-columns: minmax(0, 1fr) auto 33px; }
  .workspace-heading { gap: 5px; }
  .workspace-title .module-icon { display: none; }
  .workspace-tabs { gap: 2px; }
  .workspace-tabs > button { padding-inline: 8px; }
  .page-content { padding-top: 10px; padding-bottom: 22px; }
  .metrics { gap: 7px; }
  .metric { padding: 8px; }
  .metric > span { gap: 3px; font-size: 11px; }
  .metric > span .icon { width: 13px; height: 13px; }
  .metric strong { font-size: 20px; }
  .asset-table { --asset-grid: minmax(0, 1fr) 3.7rem 6.4rem; }
  .asset-columns > span:nth-child(2) { display: none; }
  .asset-row:first-of-type { border-top: 0; }
  .asset-kind { grid-area: 2 / 1 / 3 / -1; padding-left: 42px; }
  .asset-controls .ghost > span { display: none; }
  .asset-versions { padding-left: 12px; }
  .table-date { display: none; }
  .task-table th:first-child { width: 57%; }
  .task-table th:last-child:not(.table-date) { border-radius: 0 9px 0 0; }
}
@media (max-width: 420px) {
  :root { --gutter: 11px; }
  .quick-dock { padding-bottom: calc(12px + max(var(--host-bottom-inset, 0px), env(safe-area-inset-bottom))); }
  .workspace-title { font-size: 14px; }
  .workspace-tabs > button .icon { display: none; }
  .portfolio-columns, .portfolio-row { grid-template-columns: minmax(0, 1.65fr) minmax(52px, .65fr) minmax(0, .8fr) 25px; }
  .portfolio-columns > span:nth-child(4), .portfolio-columns > span:nth-child(5), .portfolio-count { display: none; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .table-inputs { display: none; }
  .task-table th:first-child { width: 68%; }
  .version-meta { display: none; }
  .asset-version { grid-template-columns: max-content minmax(0, 1fr) max-content; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .task-hero { gap: 8px; }
  .task-hero > .module-icon { width: 36px; height: 36px; border-radius: 9px; }
  .task-hero h3 { padding-top: 5px; font-size: 18px; }
  .task-hero-status { padding-top: 5px; }
  .task-form-fields, .task-form-actions { padding-inline: 15px; }
}
@container list (max-width: 620px) {
  .tasks-page .list-toolbar { grid-template-columns: minmax(0, 1fr); }
  .tasks-page .list-actions { flex-wrap: wrap; gap: 5px; }
  .tasks-page .list-count { margin-inline-end: auto; }
  .tasks-page .filters .search { max-width: none; }
}
@container list (max-width: 600px) {
  .assets-page .list-toolbar { grid-template-columns: minmax(0, 1fr); }
  .assets-page .list-count { margin-inline-end: auto; }
  .assets-page .filters .search { max-width: none; }
}
@media (max-height: 450px) {
  .board-column { display: grid; grid-template: auto minmax(0, 1fr) / minmax(0, 1fr) auto; gap: 4px; padding: 5px; }
  .board-column:not(:has(.column-add)) .column-header { grid-column: 1 / -1; }
  .column-header { padding-bottom: 2px; }
  .column-add.ghost { min-height: 25px; margin: 0; padding: 2px 6px; }
  .column-cards { grid-area: 2 / 1 / 3 / -1; }
}
@media (forced-colors: active) {
  .status-dot, .distribution span, .progress-track > span { forced-color-adjust: none; background: Highlight; }
  .rail-project[data-selected="true"], .portfolio-link.ghost[aria-current], .rail-scopes [aria-pressed="true"] { border-color: Highlight; }
  .rail-project[data-selected="true"]::before { forced-color-adjust: none; background: Highlight; }
}
.attachment-list .attachment-picture { position:relative; display:block; align-self:flex-start; width:76px; height:60px; padding:0; background:var(--rail); border:1px solid var(--line); border-radius:8px; }
.attachment-picture .draft-thumbnail { display:grid; place-items:center; width:100%; height:100%; min-height:0; border:0; padding:0; overflow:hidden; border-radius:7px; background:transparent; cursor:zoom-in; }
.draft-thumbnail img { display:block; width:100%; height:100%; object-fit:cover; }
.draft-thumbnail small { padding:4px; font-size:10px; overflow-wrap:anywhere; }
.attachment-picture .icon-button { position:absolute; top:2px; right:2px; color:white; background:#151515bb; border-radius:50%; }
.attachment-picture .icon-button:hover { background:#111; }
.quick-controls .quick-session { min-width:0; max-width:min(170px,45%); }
.start-task-name { font-weight:600; overflow-wrap:anywhere; }
.session-choice-field { display:grid; gap:5px; min-width:0; }
.session-choice-field select { width:100%; min-width:0; }
.file-workspace { display:flex; flex-direction:column; min-width:0; height:100dvh; background:var(--surface); color:var(--text); }
.file-workspace nav { display:flex; justify-content:center; align-items:center; gap:10px; padding:5px; border-bottom:1px solid var(--line); font-size:12px; }
.workspace-body { flex:1; min-height:0; overflow:auto; overflow-wrap:anywhere; }
.workspace-body > p { margin:12px; }
.workspace-body .preview-content { padding:12px; max-height:none; overflow:visible; }
.workspace-body .preview-image { display:grid; min-height:100%; place-content:center; }
.workspace-body .preview-image img { max-height:calc(100dvh - 60px); }
.workspace-body .preview-html { height:100%; }
.workspace-body video,.workspace-body audio { display:block; width:100%; max-height:100%; margin:auto; }

@media (prefers-reduced-motion: reduce) { button { transition: none; } }
